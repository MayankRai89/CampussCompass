name: 🛡️ PR Quality Guard

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Detect Low Quality PRs
    runs-on: ubuntu-latest

    if: >
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]'

    steps:
      - name: Run Anti-Slop Detection
        uses: peakoss/anti-slop@v0.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          max-failures: 5

          require-description: true
          require-linked-issue: true
          require-pr-template: true
          require-maintainer-can-modify: true

          require-conventional-title: true
          require-conventional-commits: false

          max-description-length: 2200
          max-emoji-count: 5

          detect-spam-usernames: true
          min-account-age: 5

          blocked-terms: |
            generated by chatgpt
            generated with chatgpt
            fully generated by ai
            auto generated pull request
            this pr was automatically generated
            created entirely using ai
            no manual changes were made
            prompt used
            as an ai language model
            chatgpt said
            claude generated
            gemini wrote
            grok generated

          strict-pr-template-sections: |
            checklist
            description

          blocked-source-branches: |
            main
            master

          exempt-author-association: OWNER,MEMBER,COLLABORATOR

          exempt-bots: |
            github-actions[bot]
            dependabot[bot]

          failure-add-pr-labels: |
            suspected-ai-slop
            needs-human-review

          failure-pr-message: |
            ## ⚠️ PR Needs Maintainer Review

            This PR was flagged by automated quality checks.

            A maintainer will review it shortly.

          close-pr: false
          lock-pr: false

      - name: Heuristic AI Detection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: pr,
                per_page: 100
              }
            );

            let suspiciousScore = 0;
            const reasons = [];

            for (const file of files) {

              const additions = file.additions || 0;
              const filename = file.filename || "";
              const patch = file.patch || "";

              if (additions > 120) {
                suspiciousScore += 2;
                reasons.push(`Large insertion in \`${filename}\` (+${additions})`);
              }

              const commentLines =
                (patch.match(/\/\/|\/\*|\*/g) || []).length;

              if (commentLines > 15) {
                suspiciousScore += 2;
                reasons.push(`Excessive comments in \`${filename}\``);
              }

              const aiPatterns = [
                "lightweight scoring helper",
                "canonical scoring helper",
                "mirrored locally here",
                "exposed on globalthis",
                "similar organizations",
                "runtime dependencies",
                "helper lives in",
                "until both surfaces can share"
              ];

              for (const pattern of aiPatterns) {
                if (patch.toLowerCase().includes(pattern)) {
                  suspiciousScore += 2;
                  reasons.push(`AI-style wording detected in \`${filename}\``);
                  break;
                }
              }

              const helperFunctions =
                patch.match(/function\s+[a-zA-Z0-9_]+/g) || [];

              if (helperFunctions.length >= 4) {
                suspiciousScore += 1;
                reasons.push(`Many helper functions added in \`${filename}\``);
              }

              const separators =
                (patch.match(/====|----/g) || []).length;

              if (separators > 3) {
                suspiciousScore += 1;
                reasons.push(`Generated-style separators in \`${filename}\``);
              }
            }

            console.log(`Suspicious score: ${suspiciousScore}`);

            if (suspiciousScore < 4) {
              console.log("PR passed heuristic checks.");
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr,
                labels: [
                  "suspected-ai-slop",
                  "needs-human-review"
                ]
              });
            } catch (e) {
              console.log("Labels already exist or couldn't be added.");
            }

            const marker = "<!-- vibecode-detection -->";

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pr,
                per_page: 100
              }
            );

            const existing = comments.find(comment =>
              comment.body.includes(marker)
            );

            const body = `
                
