name: Assign Issue on /assign

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write

jobs:
  assign:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue to commenter
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim().toLowerCase();

            if (comment !== "/assign") {
              console.log("No /assign command found.");
              return;
            }

            const issueNumber = context.payload.issue.number;
            const username = context.payload.comment.user.login;

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [username]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `✅ @${username} has been assigned to this issue. Happy coding! 🚀`
              });

            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ Sorry @${username}, I couldn't assign you to this issue.\n\n**Reason:** ${error.message}`
              });

              throw error;
            }
