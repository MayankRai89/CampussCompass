name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest

    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            👋 Welcome to **CampusCompass**!

            Thank you for opening your first issue. We appreciate you taking the time to help improve the project.

            Please ensure you've provided enough details for us to reproduce or understand the issue. A maintainer will review it as soon as possible.

            Happy Contributing! 🚀

          pr-message: |
            🎉 Welcome to **CampusCompass**!

            Thank you for your first Pull Request! We're excited to have you contribute.

            Please make sure:
            - ✅ Your code follows the project's coding standards.
            - ✅ All GitHub Actions checks pass.
            - ✅ You've linked the relevant issue (if applicable).

            A maintainer will review your PR soon. Thanks for contributing, and happy coding! 🚀
