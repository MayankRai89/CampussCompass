name: Comment Contributor Leaderboard

on:
  pull_request_target:
    types:
      - closed

permissions:
  pull-requests: write
  contents: read

jobs:
  leaderboard:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Post Leaderboard Comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "closed",
                per_page: 100
              }
            );

            const merged = prs.filter(pr => pr.merged_at);

            const scores = {};

            for (const pr of merged) {
              const user = pr.user.login;
              scores[user] = (scores[user] || 0) + 10;
            }

            const ranking = Object.entries(scores)
              .sort((a, b) => b[1] - a[1]);

            let body = "## 🏆 CampusCompass Contributor Leaderboard\n\n";
            body += "| Rank | Contributor | Score |\n";
            body += "|------|-------------|------:|\n";

            ranking.forEach(([user, score], i) => {
              const rank =
                i === 0 ? "🥇" :
                i === 1 ? "🥈" :
                i === 2 ? "🥉" :
                `${i + 1}`;

              body += `| ${rank} | @${user} | ${score} |\n`;
            });

            body += "\n🎉 Thanks for contributing to CampusCompass!";

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              body
            });
