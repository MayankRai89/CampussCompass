name: Issue Claim Reminder

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Post issue claim reminder
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            # 🚀 Welcome to CampusCompass!

            ## 🎯 Want to work on this issue?

            To claim this issue, simply comment:

            \`\`\`
            /assign
            \`\`\`

            > ⚠️ **Please do not start working until the issue has been assigned to you.**

            ---

            ## 📋 Contribution Guidelines

            | ✅ Do | ❌ Don't |
            |------|----------|
            | Claim one issue at a time | Work without being assigned |
            | Wait for assignment | Submit unrelated changes |
            | Link your PR to this issue | Create duplicate PRs |
            | Follow project guidelines | Ignore lint/tests |

            <details>
            <summary>💡 First Time Contributing?</summary>

            1. 🍴 Fork the repository
            2. 🌿 Create a new branch
            3. 💻 Make your changes
            4. ✅ Test your changes
            5. 📤 Open a Pull Request
            6. 🎉 Wait for review from the maintainers

            </details>

            ---

            ## 🌟 Support the Project

            If you enjoy contributing, please consider giving this repository a ⭐.

            Happy Contributing! 🚀
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
